# Kaelis 环境契约定义 (Environment Contract)
# 描述系统运行所需的完整环境配置

version: "1.0"
environment: development

# =============================================================================
# 第一层：操作系统
# =============================================================================
os:
  family: windows  # linux, darwin, windows
  distribution: windows  # ubuntu, debian, windows
  version: ">=10"
  architecture: amd64  # amd64, arm64
  
  # 环境变量要求
  env:
    required:
      - PYTHONIOENCODING: "utf-8"
      - PYTHONPATH: "."
    optional:
      - KAELIS_ENV: "development"

# =============================================================================
# 第二层：运行时
# =============================================================================
runtimes:
  python:
    version: ">=3.11"
    packages:
      - name: flask
        version: ">=2.0"
      - name: pyyaml
        version: ">=6.0"
      - name: pydantic
        version: ">=2.0"
      - name: requests
        version: ">=2.28"
      - name: neo4j
        version: ">=5.0"
      - name: psutil
        version: ">=5.9"
    
  node:
    version: ">=18.0"
    package_manager: npm  # npm, yarn, pnpm
    packages:
      - name: typescript
        version: ">=5.0"

# =============================================================================
# 第三层：外部服务
# =============================================================================
services:
  neo4j:
    type: database
    version: ">=5.0"
    port: 7687
    health_endpoint: "bolt://localhost:7687"
    env_required:
      - NEO4J_URI
      - NEO4J_USER
      - NEO4J_PASS
    
  kaelis-api:
    type: application
    port: 5000
    health_endpoint: "http://localhost:5000/api/health"
    
  grafana:
    type: monitoring
    port: 3001
    optional: true

# =============================================================================
# 第四层：网络
# =============================================================================
network:
  # 入站端口
  inbound_ports:
    - 5000   # Kaelis API
    - 7687   # Neo4j Bolt
    - 7474   # Neo4j HTTP
    - 3001   # Grafana (optional)
    
  # 出站域名白名单
  outbound_domains:
    - "api.deepseek.com"
    - "api.openai.com"
    - "api.moonshot.cn"
    - "registry.npmjs.org"
    - "pypi.org"
    - "github.com"
    - "registry.cn-hangzhou.aliyuncs.com"
    
  # TLS 要求
  tls_required: true

# =============================================================================
# 第五层：文件系统
# =============================================================================
files:
  required:
    - path: "contracts/openapi.yaml"
      description: "API 契约定义"
      
    - path: "config/env.schema.json"
      description: "环境变量 Schema"
      
    - path: ".env"
      description: "环境变量文件"
      optional: true
      
  directories:
    - path: "api"
      description: "后端代码目录"
      
    - path: "scripts"
      description: "脚本目录"
      
    - path: ".kaelis"
      description: "Kaelis 数据目录"

# =============================================================================
# 第六层：配置一致性
# =============================================================================
config_consistency:
  # OpenAPI 与代码的一致性
  openapi_to_code: true
  
  # 环境变量与 Schema 的一致性
  env_to_schema: true
  
  # Docker Compose 与 env.schema.json 的一致性
  compose_to_env: true
