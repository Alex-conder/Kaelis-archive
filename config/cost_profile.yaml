# Kaelis ACK v2.0 - 经济学仲裁器成本配置
# 版本: 2.0.0
# 说明: 存储经济学仲裁所需的成本参数，用于方案间的经济学权衡

version: "2.0"

# ============================================================================
# 开发者成本配置
# ============================================================================
developer:
  hourly_rate: 50  # USD/小时
  currency: "USD"
  currency_symbol: "$"
  
  # 不同级别开发者的时薪（用于更精确的成本估算）
  level_rates:
    junior: 30      # 初级开发者
    mid: 50         # 中级开发者
    senior: 80      # 高级开发者
    architect: 120  # 架构师
  
  # 间接成本系数（管理、沟通等开销）
  overhead_factor: 1.2

# ============================================================================
# Token成本配置 (每 1K tokens)
# 价格来源: 各LLM提供商官方定价 (2026年4月)
# ============================================================================
token_costs:
  # Anthropic Claude 系列
  claude-3-opus:
    input: 0.015
    output: 0.075
    provider: "anthropic"
  claude-3-sonnet:
    input: 0.003
    output: 0.015
    provider: "anthropic"
  claude-3-haiku:
    input: 0.00025
    output: 0.00125
    provider: "anthropic"
  
  # OpenAI GPT 系列
  gpt-4:
    input: 0.03
    output: 0.06
    provider: "openai"
  gpt-4-turbo:
    input: 0.01
    output: 0.03
    provider: "openai"
  gpt-3.5-turbo:
    input: 0.0005
    output: 0.0015
    provider: "openai"
  
  # 国产模型 (人民币，会自动转换)
  kimi:
    input: 0.012  # CNY
    output: 0.012  # CNY
    provider: "moonshot"
    currency: "CNY"
  qwen:
    input: 0.002  # CNY
    output: 0.006  # CNY
    provider: "alibaba"
    currency: "CNY"

# ============================================================================
# 资源成本配置
# ============================================================================
resources:
  # 计算资源
  cpu_per_hour: 0.05       # USD per CPU core/hour
  memory_gb_per_hour: 0.01 # USD per GB/hour
  
  # 存储资源
  storage_gb_per_month: 0.10  # USD per GB/month
  ssd_storage_gb_per_month: 0.12  # USD per GB/month
  
  # 网络资源
  bandwidth_gb: 0.09  # USD per GB
  
  # 数据库资源
  db_read_per_million: 0.25   # USD per million reads
  db_write_per_million: 1.25  # USD per million writes
  
  # 外部API调用
  api_call_base: 0.001  # USD per 1000 calls

# ============================================================================
# 技术债务成本系数
# ============================================================================
tech_debt:
  # 圈复杂度成本 - 每增加1点复杂度的成本系数
  complexity_factor: 0.5
  
  # 依赖成本 - 每增加1个依赖的成本系数
  dependency_factor: 1.0
  
  # 代码重复成本 - 每增加1%重复代码的成本系数
  duplication_factor: 2.0
  
  # 使用废弃技术的惩罚系数
  deprecated_penalty: 2.0
  
  # 缺乏测试的惩罚系数
  missing_tests_penalty: 1.5
  
  # 文档缺失的惩罚系数
  missing_docs_penalty: 0.8
  
  # 重构预估成本（基于技术债务）
  refactoring_base_cost: 100  # USD

# ============================================================================
# 时间成本估算参数
# ============================================================================
time_estimates:
  # 基础开发速度
  lines_per_hour: 20  # 有效代码行/小时
  
  # 不同活动的耗时系数
  activity_factors:
    coding: 1.0
    testing: 0.5
    documentation: 0.3
    review: 0.3
    debugging: 0.8
    deployment: 0.2
  
  # 复杂度系数
  complexity_multipliers:
    low: 1.0
    medium: 1.5
    high: 2.5
    critical: 4.0
  
  # 不确定性缓冲（百分比）
  uncertainty_buffer: 0.2  # 20%

# ============================================================================
# 风险成本系数
# ============================================================================
risk_factors:
  low:
    multiplier: 1.0
    description: "风险可控"
  medium:
    multiplier: 1.3
    description: "存在一定风险"
  high:
    multiplier: 2.0
    description: "风险较高，需要额外预案"
  critical:
    multiplier: 3.0
    description: "风险极高，建议重新评估"

# 风险类型的额外成本
risk_type_costs:
  security_breach: 5000    # 安全漏洞潜在成本
  data_loss: 10000         # 数据丢失潜在成本
  downtime_hour: 1000      # 每小时停机成本
  reputation_damage: 2000  # 声誉损失成本

# ============================================================================
# 质量成本系数
# ============================================================================
quality_factors:
  # 代码质量对维护成本的影响
  maintainability:
    excellent: 0.8
    good: 1.0
    fair: 1.3
    poor: 2.0
  
  # 测试覆盖率对风险的影响
  test_coverage:
    above_90: 0.9
    70_to_90: 1.0
    50_to_70: 1.2
    below_50: 1.5

# ============================================================================
# 外部检索成本
# ============================================================================
external_search:
  # GitHub API调用成本（按次计费）
  github_search_per_100: 0.01  # USD per 100 searches
  
  # Stack Exchange API（免费但有配额限制）
  stackoverflow_search: 0.0
  
  # 学术论文检索（arXiv免费）
  arxiv_search: 0.0
  
  # 搜索深度配置
  default_search_depth: 5  # 默认检索结果数量
  max_search_depth: 10     # 最大检索结果数量

# ============================================================================
# 共识引擎运行成本
# ============================================================================
consensus_engine:
  # 每个角色的基础Token开销（估算）
  base_tokens_per_role: 500
  
  # 辩论轮次的成本系数
  debate_round_cost_factor: 1.3  # 每增加一轮，成本增加30%
  
  # 最大可接受成本（用于提前终止）
  max_acceptable_cost: 10.0  # USD
  
  # 成本优化策略
  cost_optimization:
    enable_early_stop: true      # 允许提前终止
    enable_caching: true         # 启用结果缓存
    enable_model_downgrade: true # 允许降级到 cheaper model

# ============================================================================
# 成本计算公式配置
# ============================================================================
calculation:
  # 总成本计算公式说明:
  # total_cost = (time_cost + token_cost + resource_cost) * risk_multiplier + tech_debt_cost
  
  # 各组成部分的权重
  weights:
    time: 0.5        # 时间成本权重
    token: 0.05      # Token成本权重（通常很小）
    resource: 0.15   # 资源成本权重
    tech_debt: 0.3   # 技术债务权重
  
  # 是否启用详细日志
  verbose_logging: true
  
  # 成本保留小数位数
  precision: 2
