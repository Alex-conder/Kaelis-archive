<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kaelis 是一个具备持续性认知的 AI 伙伴，记住你、理解你、不断成长。" />
    <meta name="theme-color" content="#7C3AED" />
    <title>Kaelis — 你的 AI 第二大脑</title>
  </head>
  <body>
    <div id="root">
      <div style="padding:24px;max-width:1200px;margin:0 auto;background:#0B1120;min-height:100vh;">
        <div style="height:48px;background:#1E293B;border-radius:12px;margin-bottom:24px;animation:pulse 2s infinite;"></div>
        <div style="display:grid;grid-template-columns:240px 1fr;gap:24px;">
          <div style="height:80vh;background:#1E293B;border-radius:12px;animation:pulse 2s infinite;"></div>
          <div style="height:80vh;background:#1E293B;border-radius:12px;animation:pulse 2s infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/service-worker.js').catch(function() {});
        });
      }
    </script>
    <script>
      // PWA Push 订阅
      async function subscribePush() {
        if (!('serviceWorker' in navigator)) return;
        const reg = await navigator.serviceWorker.ready;
        if (!reg.pushManager) return;
        try {
          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array('BNkYlLvK8L7L8F7L8F7L8F7L8F7L8F7L8F7L8F7L8F7L8F7L8F7L8F7L8F7L8'),
            // TODO: 替换为真实 VAPID 公钥
          });
          const apiUrl = import.meta?.env?.VITE_API_URL || '';
          await fetch(apiUrl + '/api/notifications/subscribe', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ endpoint: sub.endpoint, keys: sub.toJSON().keys }),
          });
        } catch(e) {}
      }
      function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        return Uint8Array.from(rawData.split('').map(c => c.charCodeAt(0)));
      }
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', subscribePush);
      }
    </script>
  </body>
</html>
