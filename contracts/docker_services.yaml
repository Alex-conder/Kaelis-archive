# Kaelis Docker Services Contract
# 定义 Electron 桌面应用内置的 Docker 服务拓扑

version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: kaelis-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kaelis
      POSTGRES_PASSWORD: kaelis123
      POSTGRES_DB: kaelis
    volumes:
      - kaelis-postgres-data:/var/lib/postgresql/data
    health_check:
      command: "pg_isready -U kaelis -d kaelis"
      interval: 2s
      timeout: 30

  neo4j:
    image: neo4j:5-community
    container_name: kaelis-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/kaelis123
      NEO4J_PLUGINS: '["apoc", "gds"]'
    volumes:
      - kaelis-neo4j-data:/data
    health_check:
      endpoint: "http://localhost:7474"
      interval: 2s
      timeout: 45

volumes:
  kaelis-postgres-data:
  kaelis-neo4j-data:
