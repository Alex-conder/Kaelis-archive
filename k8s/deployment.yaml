# Kaelis Knowledge Graph Flywheel - Kubernetes 部署
# 适用于阿里云/腾讯云/自建 K8s 集群

apiVersion: v1
kind: Namespace
metadata:
  name: kaelis

---
# Neo4j ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: neo4j-config
  namespace: kaelis
data:
  NEO4J_AUTH: "neo4j/password"
  NEO4J_PLUGINS: '["apoc"]'
  NEO4J_dbms_security_procedures_unrestricted: "apoc.*"

---
# Neo4j Service
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: kaelis
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
  type: ClusterIP

---
# Neo4j StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: kaelis
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.14-community
          ports:
            - containerPort: 7474
              name: http
            - containerPort: 7687
              name: bolt
          envFrom:
            - configMapRef:
                name: neo4j-config
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi

---
# Kaelis App ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: kaelis-config
  namespace: kaelis
data:
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASS: "password"
  FLASK_ENV: "production"
  LOG_LEVEL: "INFO"

---
# Kaelis App Service
apiVersion: v1
kind: Service
metadata:
  name: kaelis-app
  namespace: kaelis
spec:
  selector:
    app: kaelis-app
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP

---
# Kaelis App Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaelis-app
  namespace: kaelis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kaelis-app
  template:
    metadata:
      labels:
        app: kaelis-app
    spec:
      initContainers:
        # 等待 Neo4j 就绪
        - name: wait-for-neo4j
          image: busybox:1.36
          command: 
            - sh
            - -c
            - |
              echo "Waiting for Neo4j..."
              until wget -qO- http://neo4j:7474 2>/dev/null; do
                echo "Neo4j not ready yet..."
                sleep 5
              done
              echo "Neo4j is ready!"
      containers:
        - name: app
          image: ghcr.io/yourusername/kaelis:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: kaelis-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /api/kg-flywheel/health
              port: 5000
            initialDelaySeconds: 0
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/kg-flywheel/health
              port: 5000
            initialDelaySeconds: 0
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/kg-flywheel/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}

---
# Ingress（需配合 Ingress Controller 使用）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kaelis-ingress
  namespace: kaelis
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  tls:
    - hosts:
        - kaelis.yourdomain.com
      secretName: kaelis-tls
  rules:
    - host: kaelis.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kaelis-app
                port:
                  number: 5000

---
# HPA（水平自动扩缩容）
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kaelis-hpa
  namespace: kaelis
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kaelis-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
