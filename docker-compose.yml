# Kaelis + NebulaGraph 一键启动编排
#
# 用法：
#   docker-compose up -d
#   docker-compose logs -f kaelis
#
# 服务：
#   - kaelis: Flask 后端 (port 5000)
#   - nebula-graphd: NebulaGraph 查询引擎 (port 9669)
#   - nebula-metad: NebulaGraph 元数据服务
#   - nebula-storaged: NebulaGraph 存储服务

version: "3.8"

services:
  kaelis:
    build: .
    container_name: kaelis-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - NEBULA_HOST=nebula-graphd
      - NEBULA_PORT=9669
      - NEBULA_USER=root
      - NEBULA_PASSWORD=nebula
      - NEBULA_SPACE=kaelis
      - ONEKE_MODEL_PATH=/app/models/oneke
      - ONEKE_MOCK_MODE=${ONEKE_MOCK_MODE:-false}
    depends_on:
      - nebula-graphd
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: unless-stopped
    networks:
      - kaelis-net

  nebula-metad:
    image: vesoft/nebula-metad:v3.8.0
    container_name: nebula-metad
    environment:
      - TZ=UTC
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-metad
      - --ws_ip=nebula-metad
      - --port=9559
      - --ws_http_port=19559
      - --data_path=/data/meta
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    volumes:
      - nebula-meta-data:/data/meta
      - nebula-meta-logs:/logs
    networks:
      - kaelis-net
    restart: unless-stopped

  nebula-storaged:
    image: vesoft/nebula-storaged:v3.8.0
    container_name: nebula-storaged
    environment:
      - TZ=UTC
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-storaged
      - --ws_ip=nebula-storaged
      - --port=9779
      - --ws_http_port=19779
      - --data_path=/data/storage
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    depends_on:
      - nebula-metad
    volumes:
      - nebula-storage-data:/data/storage
      - nebula-storage-logs:/logs
    networks:
      - kaelis-net
    restart: unless-stopped

  nebula-graphd:
    image: vesoft/nebula-graphd:v3.8.0
    container_name: nebula-graphd
    environment:
      - TZ=UTC
    command:
      - --meta_server_addrs=nebula-metad:9559
      - --local_ip=nebula-graphd
      - --ws_ip=nebula-graphd
      - --port=9669
      - --ws_http_port=19669
      - --log_dir=/logs
      - --v=0
      - --minloglevel=0
    ports:
      - "9669:9669"
    depends_on:
      - nebula-metad
      - nebula-storaged
    volumes:
      - nebula-graph-logs:/logs
    networks:
      - kaelis-net
    restart: unless-stopped

  # 可选：NebulaGraph Studio（可视化图浏览器）
  nebula-studio:
    image: vesoft/nebula-graph-studio:v3.8.0
    container_name: nebula-studio
    ports:
      - "7001:7001"
    depends_on:
      - nebula-graphd
    networks:
      - kaelis-net
    restart: unless-stopped

volumes:
  nebula-meta-data:
  nebula-meta-logs:
  nebula-storage-data:
  nebula-storage-logs:
  nebula-graph-logs:

networks:
  kaelis-net:
    driver: bridge
