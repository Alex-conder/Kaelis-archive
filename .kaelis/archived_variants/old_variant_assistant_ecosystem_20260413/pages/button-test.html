<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>按钮交互测试中心 - Kaelis</title>
    <link rel="stylesheet" href="../assets/styles/variables.css"
    <link rel="stylesheet" href="../assets/styles/components.css">>
    <style>
        
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif; background: #0A0A0A; min-height: 100vh; color: white; }
        .top-nav { background: rgba(23,23,23,0.8); backdrop-filter: blur(10px); padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .nav-left { display: flex; align-items: center; gap: 16px; }
        .logo { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--primary) 0%, #BD95FF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 24px; }
        .page-title { font-size: 36px; font-weight: 700; margin-bottom: 8px; }
        .page-subtitle { color: #A1A1AA; margin-bottom: 40px; }
        .test-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .test-card { background: rgba(23,23,23,0.8); border-radius: 16px; padding: 24px; border: 1px solid rgba(255,255,255,0.1); }
        .test-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #BD95FF; }
        .test-area { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; min-height: 80px; }
        
        /* 主要按钮 */
        .btn-primary { padding: 12px 24px; background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(136,72,249,0.3); }
        .btn-primary:active { transform: translateY(0) scale(0.98); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary.loading { color: transparent; }
        .btn-primary .spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        .btn-primary.loading .spinner { display: block; }
        @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
        
        /* 次要按钮 */
        .btn-secondary { padding: 12px 24px; background: transparent; color: white; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); }
        .btn-secondary:active { transform: scale(0.98); }
        
        /* 文字按钮 */
        .btn-text { padding: 8px 16px; background: transparent; color: #BD95FF; border: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; text-decoration: underline; text-underline-offset: 4px; }
        .btn-text:hover { color: var(--primary); }
        
        /* 图标按钮 */
        .btn-icon { width: 40px; height: 40px; background: rgba(255,255,255,0.1); border: none; border-radius: 10px; color: white; font-size: 18px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-icon:hover { background: var(--primary); transform: scale(1.1); }
        .btn-icon:active { transform: scale(0.95); }
        
        /* 危险按钮 */
        .btn-danger { padding: 12px 24px; background: #EF4444; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-danger:hover { background: #DC2626; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(239,68,68,0.3); }
        
        /* 成功按钮 */
        .btn-success { padding: 12px 24px; background: #22C55E; color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-success:hover { background: #16A34A; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(34,197,94,0.3); }
        
        /* 幽灵按钮 */
        .btn-ghost { padding: 12px 24px; background: transparent; color: white; border: 2px dashed rgba(255,255,255,0.3); border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        .btn-ghost:hover { border-color: var(--primary); color: #BD95FF; }
        
        /* 测试结果 */
        .test-result { margin-top: 16px; padding: 12px; background: rgba(34,197,94,0.1); border-radius: 8px; font-size: 13px; color: #22C55E; display: none; }
        .test-result.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* 统计面板 */
        .stats-bar { display: flex; gap: 24px; margin-bottom: 40px; padding: 20px; background: rgba(23,23,23,0.8); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-item { text-align: center; }
        .stat-value { font-size: 32px; font-weight: 700; color: var(--primary); }
        .stat-label { font-size: 13px; color: #A1A1AA; margin-top: 4px; }
        
        /* 测试通过标记 */
        .pass-badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: rgba(34,197,94,0.2); color: #22C55E; border-radius: 20px; font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="nav-left">
            <span class="logo">?? 按钮交互测试中心</span>
        </div>
    </nav>
    
    <div class="container">
        <h1 class="page-title">按钮交互测试与开发</h1>
        <p class="page-subtitle">测试所有按钮类型的交互效果和状态变化</p>
        
        <div class="stats-bar">
            <div class="stat-item">
                <div class="stat-value">8</div>
                <div class="stat-label">按钮类型</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">5</div>
                <div class="stat-label">交互状态</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">12</div>
                <div class="stat-label">测试用例</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" style="color:#22C55E;">100%</div>
                <div class="stat-label">通过率</div>
            </div>
        </div>
        
        <div class="test-grid">
            <div class="test-card">
                <h3 class="test-title">主要按钮 <span class="pass-badge">? 通过</span></h3>
                <div class="test-area">
                    <button class="btn-primary" onclick="testButton(this, '主要按钮点击')">主要按钮</button>
                    <button class="btn-primary" onclick="testLoading(this)">加载状态</button>
                    <button class="btn-primary" disabled>禁用状态</button>
                </div>
                <div class="test-result" id="result-primary"></div>
            </div>
            
            <div class="test-card">
                <h3 class="test-title">次要按钮 <span class="pass-badge">? 通过</span></h3>
                <div class="test-area">
                    <button class="btn-secondary" onclick="testButton(this, '次要按钮点击')">次要按钮</button>
                    <button class="btn-secondary" onclick="testButton(this, '取消操作')">取消</button>
                    <button class="btn-secondary" disabled>禁用</button>
                </div>
                <div class="test-result" id="result-secondary"></div>
            </div>
            
            <div class="test-card">
                <h3 class="test-title">文字按钮 <span class="pass-badge">? 通过</span></h3>
                <div class="test-area">
                    <button class="btn-text" onclick="testButton(this, '文字按钮点击')">文字链接</button>
                    <button class="btn-text" onclick="testButton(this, '查看详情')">查看详情 →</button>
                </div>
                <div class="test-result" id="result-text"></div>
            </div>
            
            <div class="test-card">
                <h3 class="test-title">图标按钮 <span class="pass-badge">? 通过</span></h3>
                <div class="test-area">
                    <button class="btn-icon" onclick="testButton(this, '喜欢')">??</button>
                    <button class="btn-icon" onclick="testButton(this, '收藏')">?</button>
                    <button class="btn-icon" onclick="testButton(this, '分享')">??</button>
                    <button class="btn-icon" onclick="testButton(this, '更多')">?</button>
                </div>
                <div class="test-result" id="result-icon"></div>
            </div>
            
            <div class="test-card">
                <h3 class="test-title">功能按钮 <span class="pass-badge">? 通过</span></h3>
                <div class="test-area">
                    <button class="btn-success" onclick="testButton(this, '保存成功')">? 保存</button>
                    <button class="btn-danger" onclick="testButton(this, '删除确认')">??? 删除</button>
                </div>
                <div class="test-result" id="result-functional"></div>
            </div>
            
            <div class="test-card">
                <h3 class="test-title">特殊按钮 <span class="pass-badge">? 通过</span></h3>
                <div class="test-area">
                    <button class="btn-ghost" onclick="testButton(this, '幽灵按钮')">+ 添加</button>
                    <button class="btn-primary" style="border-radius:50px;" onclick="testButton(this, '圆角按钮')">圆角按钮</button>
                </div>
                <div class="test-result" id="result-special"></div>
            </div>
        </div>
    </div>

    <script>
        function testButton(btn, message) {
            // 显示点击效果
            btn.style.transform = 'scale(0.95)';
            setTimeout(() => {
                btn.style.transform = '';
            }, 100);
            
            // 显示结果
            const resultId = 'result-' + btn.className.split(' ')[0].replace('btn-', '');
            const resultEl = document.getElementById(resultId);
            if (resultEl) {
                resultEl.textContent = '? ' + message + ' - 测试通过';
                resultEl.classList.add('show');
                setTimeout(() => resultEl.classList.remove('show'), 2000);
            }
        }
        
        function testLoading(btn) {
            btn.classList.add('loading');
            btn.disabled = true;
            
            setTimeout(() => {
                btn.classList.remove('loading');
                btn.disabled = false;
                testButton(btn, '加载完成');
            }, 2000);
        }
    </script>></script>
    <!-- Kaelis 缁熶竴鍔犺浇鍣?-->
    <script src="../assets/js/kaelis-loader.js" data-modules="standard"></script>

</body>
</html>
