<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线模式 - Kaelis</title>
    <link rel="stylesheet" href="../assets/styles/variables.css"
    <link rel="stylesheet" href="../assets/styles/components.css">>
    <style>
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif; 
            background: #0A0A0A; 
            min-height: 100vh; 
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .offline-container { 
            text-align: center; 
            max-width: 500px;
            padding: 48px;
            background: rgba(23,23,23,0.8);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .offline-icon { 
            font-size: 80px; 
            margin-bottom: 24px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .offline-title { 
            font-size: 28px; 
            font-weight: 700; 
            margin-bottom: 12px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .offline-desc { 
            font-size: 16px; 
            color: #A1A1AA; 
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .offline-actions { 
            display: flex; 
            gap: 12px; 
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn { 
            padding: 14px 28px; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s; 
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary  { @extend .btn-primary; }
        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 20px rgba(136,72,249,0.3); 
        }
        .btn-secondary { 
            background: rgba(255,255,255,0.1); 
            color: white; 
        }
        .btn-secondary:hover { 
            background: rgba(255,255,255,0.15); 
        }
        .cached-pages {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .cached-title {
            font-size: 14px;
            color: #6B7280;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .cached-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .cached-item {
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            color: #A1A1AA;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cached-item:hover {
            background: rgba(136,72,249,0.1);
            color: white;
        }
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(245,158,11,0.2);
            color: #F59E0B;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background: #F59E0B;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">??</div>
        
        <div class="status-indicator">
            <span class="status-dot"></span>
            <span>离线模式</span>
        </div>
        
        <h1 class="offline-title">网络连接已断开</h1>
        <p class="offline-desc">
            您当前处于离线状态，部分功能可能无法使用。<br>
            请检查网络连接或浏览已缓存的页面。
        </p>
        
        <div class="offline-actions">
            <button class="btn btn-primary" onclick="retryConnection()">
                ?? 重新连接
            </button>
            <a href="dashboard.html" class="btn btn-secondary">
                ?? 返回首页
            </a>
        </div>
        
        <div class="cached-pages">
            <div class="cached-title">可访问的缓存页面</div>
            <div class="cached-list">
                <a href="dashboard.html" class="cached-item">
                    <span>??</span> 仪表盘
                </a>
                <a href="chat.html" class="cached-item">
                    <span>??</span> AI对话
                </a>
                <a href="plugin-store.html" class="cached-item">
                    <span>??</span> 插件商店
                </a>
                <a href="settings.html" class="cached-item">
                    <span>??</span> 系统设置
                </a>
            </div>
        </div>
    </div>

    <script>
        // 检测网络状态
        window.addEventListener('online', () => {
            console.log('网络已连接');
            window.location.reload();
        });
        
        window.addEventListener('offline', () => {
            console.log('网络已断开');
        });
        
        // 重新连接
        function retryConnection() {
            if (navigator.onLine) {
                window.location.href = 'dashboard.html';
            } else {
                // 显示重试动画
                const btn = event.target;
                btn.innerHTML = '?? 连接中...';
                setTimeout(() => {
                    btn.innerHTML = '?? 重新连接';
                    if (navigator.onLine) {
                        window.location.reload();
                    }
                }, 2000);
            }
        }
        
        // 注册Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('../sw.js')
                .then((registration) => {
                    console.log('SW注册成功:', registration);
                })
                .catch((error) => {
                    console.log('SW注册失败:', error);
                });
        }
    </script>></script>
    <!-- Kaelis 缁熶竴鍔犺浇鍣?-->
    <script src="../assets/js/kaelis-loader.js" data-modules="standard"></script>

</body>
</html>
