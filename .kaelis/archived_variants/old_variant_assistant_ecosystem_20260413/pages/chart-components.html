<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图表组件库 - Kaelis</title>
    <link rel="stylesheet" href="../assets/styles/variables.css"
    <link rel="stylesheet" href="../assets/styles/components.css">>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif; background: #0A0A0A; min-height: 100vh; color: white; }
        .top-nav { background: rgba(23,23,23,0.8); backdrop-filter: blur(10px); padding: 16px 24px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-btn { width: 40px; height: 40px; border: none; background: rgba(255,255,255,0.1); border-radius: 10px; cursor: pointer; font-size: 20px; color: white; }
        .logo { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--primary) 0%, #BD95FF 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 40px 24px; }
        .page-header { margin-bottom: 40px; }
        .page-title { font-size: 36px; font-weight: 700; margin-bottom: 12px; }
        
        /* 图表网格 */
        .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 24px; margin-bottom: 40px; }
        .chart-card { 
            background: rgba(23,23,23,0.8); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 16px; 
            padding: 24px;
        }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-title { font-size: 16px; font-weight: 600; }
        .chart-actions { display: flex; gap: 8px; }
        .chart-btn { 
            padding: 6px 12px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 6px; 
            color: white; 
            font-size: 12px; 
            cursor: pointer;
        }
        .chart-container { position: relative; height: 280px; }
        .chart-container.large { height: 350px; }
        
        /* 统计卡片 */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { 
            background: rgba(23,23,23,0.8); 
            border: 1px solid rgba(255,255,255,0.05); 
            border-radius: 12px; 
            padding: 24px;
        }
        .stat-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
        .stat-icon { 
            width: 44px; 
            height: 44px; 
            border-radius: 10px; 
            background: rgba(136,72,249,0.15); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px; 
        }
        .stat-trend { 
            padding: 4px 10px; 
            background: rgba(34,197,94,0.15); 
            border-radius: 6px; 
            font-size: 12px; 
            color: #22C55E; 
            font-weight: 500;
        }
        .stat-value { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
        .stat-label { font-size: 13px; color: #6B7280; }
        
        /* 自定义图表样式 */
        .custom-chart { 
            display: flex; 
            align-items: flex-end; 
            justify-content: space-around; 
            height: 200px; 
            padding: 20px 0;
            gap: 12px;
        }
        .bar-item { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 8px;
        }
        .bar { 
            width: 100%; 
            max-width: 40px; 
            background: linear-gradient(180deg, var(--primary) 0%, var(--secondary) 100%); 
            border-radius: 6px 6px 0 0; 
            transition: all 0.3s;
            position: relative;
        }
        .bar:hover { opacity: 0.8; }
        .bar-label { font-size: 12px; color: #6B7280; }
        .bar-value { 
            position: absolute; 
            top: -24px; 
            left: 50%; 
            transform: translateX(-50%); 
            font-size: 11px; 
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .bar:hover .bar-value { opacity: 1; }
        
        /* 环形图 */
        .donut-container { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 250px;
            position: relative;
        }
        .donut-center { 
            position: absolute; 
            text-align: center;
        }
        .donut-value { font-size: 36px; font-weight: 700; }
        .donut-label { font-size: 13px; color: #6B7280; }
        
        /* 进度环 */
        .progress-ring-container { 
            display: flex; 
            justify-content: space-around; 
            padding: 20px;
        }
        .progress-ring-item { text-align: center; }
        .progress-ring { 
            width: 120px; 
            height: 120px; 
            transform: rotate(-90deg);
        }
        .progress-ring-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; }
        .progress-ring-fill { 
            fill: none; 
            stroke: url(#gradient); 
            stroke-width: 8; 
            stroke-linecap: round;
            stroke-dasharray: 339.292;
            stroke-dashoffset: 339.292;
            transition: stroke-dashoffset 1s ease;
        }
        .progress-ring-text { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
            font-size: 20px; 
            font-weight: 700;
        }
        
        /* 仪表盘 */
        .gauge-container { 
            display: flex; 
            justify-content: center; 
            padding: 20px;
        }
        .gauge { width: 250px; height: 150px; }
        
        /* 迷你图 */
        .sparkline-container { display: flex; gap: 24px; flex-wrap: wrap; }
        .sparkline-item { 
            background: rgba(255,255,255,0.03); 
            border-radius: 12px; 
            padding: 20px;
            min-width: 200px;
        }
        .sparkline-header { margin-bottom: 12px; }
        .sparkline-title { font-size: 13px; color: #6B7280; margin-bottom: 4px; }
        .sparkline-value { font-size: 24px; font-weight: 700; }
        .sparkline { height: 40px; display: flex; align-items: flex-end; gap: 3px; }
        .sparkline-bar { 
            flex: 1; 
            background: var(--primary); 
            border-radius: 2px;
            opacity: 0.6;
        }
        .sparkline-bar:hover { opacity: 1; }
        
        /* 热力图 */
        .heatmap { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .heatmap-cell { 
            aspect-ratio: 1; 
            border-radius: 4px; 
            cursor: pointer;
            transition: all 0.2s;
        }
        .heatmap-cell:hover { transform: scale(1.1); }
        .heatmap-0 { background: rgba(255,255,255,0.05); }
        .heatmap-1 { background: rgba(136,72,249,0.2); }
        .heatmap-2 { background: rgba(136,72,249,0.4); }
        .heatmap-3 { background: rgba(136,72,249,0.6); }
        .heatmap-4 { background: rgba(136,72,249,0.8); }
        .heatmap-legend { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin-top: 12px; 
            font-size: 12px; 
            color: #6B7280;
            justify-content: flex-end;
        }
        
        /* 桑基图简化版 */
        .sankey-container { height: 200px; position: relative; }
        .sankey-node { 
            position: absolute; 
            padding: 8px 16px; 
            background: rgba(136,72,249,0.2); 
            border-radius: 6px; 
            font-size: 12px;
        }
    </style>
</head>

    <script>
        // Chart.js 默认配置

        Chart.defaults.borderColor = 'rgba(255,255,255,0.1)';
        
        // 折线图
        const lineCtx = document.getElementById('lineChart').getContext('2d');
        new Chart(lineCtx, {
            type: 'line',
            data: {
                labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月'],
                datasets: [{
                    label: '访问量',
                    data: [12000, 19000, 15000, 25000, 22000, 30000, 35000],
                    borderColor: 'var(--primary)',
                    backgroundColor: 'rgba(136,72,249,0.1)',
                    fill: true,
                    tension: 0.4
                }, {
                    label: '独立访客',
                    data: [8000, 12000, 10000, 15000, 14000, 18000, 22000],
                    borderColor: 'var(--secondary)',
                    backgroundColor: 'rgba(59,130,246,0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { padding: 20 }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255,255,255,0.05)' }
                    },
                    x: {
                        grid: { display: false }
                    }
                }
            }
        });
        
        // 柱状图
        const barCtx = document.getElementById('barChart').getContext('2d');
        new Chart(barCtx, {
            type: 'bar',
            data: {
