<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能助手 - Kaelis</title>
    <link rel="stylesheet" href="../assets/styles/variables.css"
    <link rel="stylesheet" href="../assets/styles/components.css">>
    <style>
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif; 
            background: #0A0A0A; 
            min-height: 100vh; 
            color: white;
            display: flex;
            flex-direction: column;
        }
        
        /* 头部 */
        .header { 
            padding: 20px 40px; 
            background: rgba(23,23,23,0.95); 
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header-title { 
            display: flex; 
            align-items: center; 
            gap: 12px;
            font-size: 20px;
            font-weight: 600;
        }
        .header-title .icon { 
            width: 40px; 
            height: 40px; 
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); 
            border-radius: 10px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 20px;
        }
        .header-actions { display: flex; gap: 12px; }
        .header-btn { 
            padding: 10px 20px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 8px; 
            color: white; 
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .header-btn:hover { background: rgba(136,72,249,0.2); border-color: var(--primary); }
        
        /* 主内容区 */
        .main { 
            flex: 1; 
            display: flex;
            overflow: hidden;
        }
        
        /* 侧边栏 */
        .sidebar { 
            width: 300px; 
            background: rgba(23,23,23,0.8); 
            border-right: 1px solid rgba(255,255,255,0.1);
            padding: 24px;
            overflow-y: auto;
        }
        .sidebar-title { 
            font-size: 12px; 
            color: #6B7280; 
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .chat-list { }
        .chat-item { 
            display: flex; 
            align-items: center; 
            gap: 12px;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 8px;
        }
        .chat-item:hover, .chat-item.active { 
            background: rgba(136,72,249,0.1);
        }
        .chat-icon { font-size: 20px; }
        .chat-info { flex: 1; }
        .chat-name { font-size: 14px; font-weight: 500; }
        .chat-preview { 
            font-size: 12px; 
            color: #6B7280; 
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-time { font-size: 11px; color: #6B7280; }
        
        /* 聊天区域 */
        .chat-area { 
            flex: 1; 
            display: flex;
            flex-direction: column;
            background: linear-gradient(180deg, #0A0A0A 0%, #1a1a2e 100%);
        }
        
        /* 消息列表 */
        .messages { 
            flex: 1; 
            padding: 40px;
            overflow-y: auto;
        }
        .message { 
            display: flex; 
            gap: 16px; 
            margin-bottom: 24px;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user { flex-direction: row-reverse; }
        .message-avatar { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px;
            flex-shrink: 0;
        }
        .message.ai .message-avatar { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); 
        }
        .message.user .message-avatar { 
            background: rgba(255,255,255,0.1); 
        }
        .message-content { 
            max-width: 70%; 
            padding: 16px 20px;
            border-radius: 16px;
            line-height: 1.6;
        }
        .message.ai .message-content { 
            background: rgba(23,23,23,0.9); 
            border: 1px solid rgba(255,255,255,0.1);
            border-top-left-radius: 4px;
        }
        .message.user .message-content { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); 
            border-top-right-radius: 4px;
        }
        .message-time { 
            font-size: 11px; 
            color: #6B7280; 
            margin-top: 8px;
        }
        
        /* 代码块 */
        .code-block { 
            background: #1a1a2e; 
            border-radius: 8px; 
            padding: 16px;
            margin: 12px 0;
            font-family: monospace;
            font-size: 13px;
            overflow-x: auto;
        }
        .code-header { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 12px;
            font-size: 12px;
            color: #6B7280;
        }
        
        /* 输入区域 */
        .input-area { 
            padding: 24px 40px; 
            background: rgba(23,23,23,0.95); 
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .input-box { 
            display: flex; 
            gap: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 8px;
        }
        .input-field { 
            flex: 1; 
            padding: 12px 16px; 
            background: transparent; 
            border: none; 
            color: white; 
            font-size: 15px;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 120px;
        }
        .input-field::placeholder { color: #6B7280; }
        .input-actions { 
            display: flex; 
            align-items: flex-end; 
            gap: 8px;
            padding: 4px;
        }
        .input-btn { 
            width: 40px; 
            height: 40px; 
            background: rgba(255,255,255,0.05); 
            border: none; 
            border-radius: 10px; 
            color: white; 
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .input-btn:hover { background: rgba(136,72,249,0.2); }
        .input-btn.send { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); 
        }
        .input-btn.send:hover { opacity: 0.9; }
        
        /* 快捷操作 */
        .quick-actions { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .quick-action { 
            padding: 8px 16px; 
            background: rgba(136,72,249,0.1); 
            border: 1px solid rgba(136,72,249,0.3); 
            border-radius: 20px; 
            font-size: 13px;
            color: #A1A1AA;
            cursor: pointer;
            transition: all 0.3s;
        }
        .quick-action:hover { 
            background: rgba(136,72,249,0.2); 
            color: white;
        }
        
        /* 加载动画 */
        .typing-indicator { 
            display: flex; 
            gap: 4px; 
            padding: 20px;
        }
        .typing-dot { 
            width: 8px; 
            height: 8px; 
            background: var(--primary); 
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }
        
        /* 功能面板 */
        .feature-panel { 
            position: absolute; 
            right: 24px; 
            top: 100px; 
            width: 280px; 
            background: rgba(23,23,23,0.95); 
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            display: none;
        }
        .feature-panel.show { display: block; }
        .feature-title { font-size: 16px; margin-bottom: 16px; }
        .feature-item { 
            display: flex; 
            align-items: center; 
            gap: 12px;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .feature-item:hover { background: rgba(136,72,249,0.1); }
        .feature-icon { font-size: 20px; }
        .feature-name { font-size: 14px; }
        
        /* 欢迎消息 */
        .welcome { 
            text-align: center; 
            padding: 60px 40px;
        }
        .welcome-icon { 
            font-size: 64px; 
            margin-bottom: 24px;
        }
        .welcome-title { 
            font-size: 28px; 
            margin-bottom: 12px;
        }
        .welcome-desc { 
            font-size: 16px; 
            color: #6B7280; 
            margin-bottom: 32px;
        }
        .welcome-suggestions { 
            display: flex; 
            justify-content: center; 
            gap: 12px;
            flex-wrap: wrap;
        }
        .welcome-suggestion { 
            padding: 12px 20px; 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 10px; 
            font-size: 14px;
            color: #A1A1AA;
            cursor: pointer;
            transition: all 0.3s;
        }
        .welcome-suggestion:hover { 
            background: rgba(136,72,249,0.1); 
            border-color: var(--primary);
            color: white;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-title">
            <div class="icon">🤖</div>
            <span>AI 智能助手</span>
        </div>
        <div class="header-actions">
            <button class="header-btn" onclick="toggleFeaturePanel()">⚡ 功能</button>
            <button class="header-btn">⚙️ 设置</button>
        </div>
    </header>
    
    <div class="main">
        <aside class="sidebar">
            <div class="sidebar-title">最近对话</div>
            <div class="chat-list">
                <div class="chat-item active">
                    <span class="chat-icon">💬</span>
                    <div class="chat-info">
                        <div class="chat-name">新对话</div>
                        <div class="chat-preview">代码优化建议...</div>
                    </div>
                    <span class="chat-time">刚刚</span>
                </div>
                <div class="chat-item">
                    <span class="chat-icon">📊</span>
                    <div class="chat-info">
                        <div class="chat-name">数据分析</div>
                        <div class="chat-preview">帮我分析销售数据...</div>
                    </div>
                    <span class="chat-time">2小时前</span>
                </div>
                <div class="chat-item">
                    <span class="chat-icon">🎨</span>
                    <div class="chat-info">
                        <div class="chat-name">UI设计</div>
                        <div class="chat-preview">设计一个登录页面...</div>
                    </div>
                    <span class="chat-time">昨天</span>
                </div>
                <div class="chat-item">
                    <span class="chat-icon">🐛</span>
                    <div class="chat-info">
                        <div class="chat-name">Bug修复</div>
                        <div class="chat-preview">这个错误怎么解决...</div>
                    </div>
                    <span class="chat-time">3天前</span>
                </div>
            </div>
        </aside>
        
        <div class="chat-area">
            <div class="messages" id="messages">
                <!-- 欢迎消息 -->
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🤖</div>
                    <h2 class="welcome-title">我是 Kaelis AI 助手</h2>
                    <p class="welcome-desc">我可以帮你写代码、分析数据、解答问题，或者只是聊聊天</p>
                    <div class="welcome-suggestions">
                        <div class="welcome-suggestion" onclick="sendQuickMessage('帮我优化这段代码')">💻 代码优化</div>
                        <div class="welcome-suggestion" onclick="sendQuickMessage('解释这个概念')">📚 知识解答</div>
                        <div class="welcome-suggestion" onclick="sendQuickMessage('生成测试数据')">🎲 生成数据</div>
                        <div class="welcome-suggestion" onclick="sendQuickMessage('翻译这段文字')">🌐 翻译</div>
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <div class="quick-actions">
                    <span class="quick-action" onclick="sendQuickMessage('总结这段内容')">总结</span>
                    <span class="quick-action" onclick="sendQuickMessage('优化代码')">优化</span>
                    <span class="quick-action" onclick="sendQuickMessage('生成文档')">文档</span>
                    <span class="quick-action" onclick="sendQuickMessage('调试错误')">调试</span>
                </div>
                <div class="input-box">
                    <textarea class="input-field" id="messageInput" placeholder="输入消息..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
                    <div class="input-actions">
                        <button class="input-btn">📎</button>
                        <button class="input-btn send" onclick="sendMessage()">➤</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="feature-panel" id="featurePanel">
        <div class="feature-title">AI 功能</div>
        <div class="feature-item">
            <span class="feature-icon">💻</span>
            <span class="feature-name">代码助手</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">📊</span>
            <span class="feature-name">数据分析</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">🎨</span>
            <span class="feature-name">设计建议</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">📝</span>
            <span class="feature-name">文档生成</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">🌐</span>
            <span class="feature-name">翻译</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">🐛</span>
            <span class="feature-name">Bug诊断</span>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const welcome = document.getElementById('welcome');
        
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        function sendQuickMessage(text) {
            messageInput.value = text;
            sendMessage();
        }
        
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            // 隐藏欢迎消息
            if (welcome) welcome.style.display = 'none';
            
            // 添加用户消息
            addMessage('user', text);
            messageInput.value = '';
            
            // 显示加载动画
            showTypingIndicator();
            
            // 模拟AI回复
            setTimeout(() => {
                hideTypingIndicator();
                const response = generateAIResponse(text);
                addMessage('ai', response);
            }, 1500);
        }
        
        function addMessage(type, content) {
            const message = document.createElement('div');
            message.className = `message ${type}`;
            
            const avatar = type === 'ai' ? '🤖' : '👤';
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            message.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div>
                    <div class="message-content">${content}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            messagesContainer.appendChild(message);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function showTypingIndicator() {
            const indicator = document.createElement('div');
            indicator.className = 'message ai';
            indicator.id = 'typingIndicator';
            indicator.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(indicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }
        
        function generateAIResponse(input) {
            const responses = [
                "我理解你的需求。让我为你提供一个解决方案...",
                "这是一个很好的问题。根据最佳实践，我建议...",
                "我已经分析了你的请求。以下是详细的回答：",
                "没问题！我来帮你处理这个任务。",
                "根据我的分析，这里有几点建议供你参考："
            ];
            
            if (input.includes('代码') || input.includes('优化')) {
                return `我来帮你优化这段代码。以下是改进后的版本：<div class="code-block"><div class="code-header"><span>javascript</span><span>复制</span></div>function optimizedFunction() {<br>  // 优化后的代码<br>  const result = data.filter(item => item.active)<br>    .map(item => item.value)<br>    .reduce((a, b) => a + b, 0);<br>  return result;<br>}</div>主要优化点：<br>1. 使用链式调用提高可读性<br>2. 添加了默认值防止错误<br>3. 减少了循环次数`;
            }
            
            return responses[Math.floor(Math.random() * responses.length)];
        }
        
        function toggleFeaturePanel() {
            document.getElementById('featurePanel').classList.toggle('show');
        }
        
        // 自动调整输入框高度
        messageInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 120) + 'px';
        });
    </script>
    <!-- Kaelis 统一加载器 -->
    <script src="../assets/js/kaelis-loader.js" data-modules="chat"></script>
</body>
</html>
