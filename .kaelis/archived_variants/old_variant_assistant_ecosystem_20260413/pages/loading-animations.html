<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>加载动画 - Kaelis</title>
    <link rel="stylesheet" href="../assets/styles/variables.css"
    <link rel="stylesheet" href="../assets/styles/components.css">>
    <style>
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif; 
            background: #0A0A0A; 
            min-height: 100vh; 
            color: white; 
            padding: 40px 20px;
        }
        
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 32px; margin-bottom: 8px; }
        .header p { color: #6B7280; }
        
        .section { margin-bottom: 48px; }
        .section-title { 
            font-size: 18px; 
            margin-bottom: 24px; 
            color: #A1A1AA;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: 2px;
        }
        
        .demo-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 24px;
        }
        
        .demo-card { 
            background: rgba(23,23,23,0.8); 
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 20px; 
            padding: 40px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .demo-card h3 { 
            font-size: 14px; 
            color: #6B7280; 
            margin-top: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* ===== 经典 Spinner ===== */
        .spinner { 
            width: 50px; 
            height: 50px; 
            border: 4px solid rgba(136,72,249,0.2); 
            border-top-color: var(--primary); 
            border-radius: 50%; 
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* 双环 Spinner */
        .spinner-double { 
            width: 50px; 
            height: 50px; 
            position: relative;
        }
        .spinner-double::before, .spinner-double::after {
            content: '';
            position: absolute;
            border: 4px solid transparent;
            border-radius: 50%;
        }
        .spinner-double::before {
            top: 0; left: 0; right: 0; bottom: 0;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }
        .spinner-double::after {
            top: 8px; left: 8px; right: 8px; bottom: 8px;
            border-bottom-color: var(--secondary);
            animation: spin 1.5s linear infinite reverse;
        }
        
        /* 脉冲 Spinner */
        .spinner-pulse { 
            width: 50px; 
            height: 50px; 
            background: var(--primary); 
            border-radius: 50%; 
            animation: pulse-scale 1.5s ease-in-out infinite;
        }
        @keyframes pulse-scale {
            0%, 100% { transform: scale(0); opacity: 1; }
            50% { transform: scale(1); opacity: 0; }
        }
        
        /* 点状 Spinner */
        .spinner-dots { 
            display: flex; 
            gap: 8px;
        }
        .spinner-dots span { 
            width: 12px; 
            height: 12px; 
            background: var(--primary); 
            border-radius: 50%; 
            animation: dots 1.4s ease-in-out infinite both;
        }
        .spinner-dots span:nth-child(1) { animation-delay: -0.32s; }
        .spinner-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes dots {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* 轨道 Spinner */
        .spinner-orbit { 
            width: 50px; 
            height: 50px; 
            position: relative;
        }
        .spinner-orbit::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .spinner-orbit::after {
            content: '';
            position: absolute;
            top: -4px; left: 50%;
            width: 10px; height: 10px;
            background: var(--primary);
            border-radius: 50%;
            transform: translateX(-50%);
            animation: orbit 1s linear infinite;
            transform-origin: 50% 29px;
        }
        @keyframes orbit { to { transform: translateX(-50%) rotate(360deg); } }
        
        /* ===== 创意加载器 ===== */
        /* 波浪 */
        .loader-wave { 
            display: flex; 
            align-items: center; 
            gap: 4px;
            height: 40px;
        }
        .loader-wave span { 
            width: 6px; 
            height: 100%; 
            background: linear-gradient(180deg, var(--primary) 0%, var(--secondary) 100%); 
            border-radius: 3px;
            animation: wave 1.2s ease-in-out infinite;
        }
        .loader-wave span:nth-child(1) { animation-delay: 0s; }
        .loader-wave span:nth-child(2) { animation-delay: 0.1s; }
        .loader-wave span:nth-child(3) { animation-delay: 0.2s; }
        .loader-wave span:nth-child(4) { animation-delay: 0.3s; }
        .loader-wave span:nth-child(5) { animation-delay: 0.4s; }
        @keyframes wave {
            0%, 100% { transform: scaleY(0.3); }
            50% { transform: scaleY(1); }
        }
        
        /* 圆形扩散 */
        .loader-ripple { 
            width: 60px; 
            height: 60px; 
            position: relative;
        }
        .loader-ripple::before, .loader-ripple::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 100%; height: 100%;
            border: 3px solid var(--primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: ripple 2s linear infinite;
        }
        .loader-ripple::after { animation-delay: 1s; }
        @keyframes ripple {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        
        /* 方块网格 */
        .loader-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 4px;
            width: 50px;
        }
        .loader-grid span { 
            width: 14px; 
            height: 14px; 
            background: var(--primary); 
            border-radius: 2px;
            animation: grid-fade 1.3s ease-in-out infinite;
        }
        .loader-grid span:nth-child(1) { animation-delay: 0s; }
        .loader-grid span:nth-child(2) { animation-delay: 0.1s; }
        .loader-grid span:nth-child(3) { animation-delay: 0.2s; }
        .loader-grid span:nth-child(4) { animation-delay: 0.1s; }
        .loader-grid span:nth-child(5) { animation-delay: 0.2s; }
        .loader-grid span:nth-child(6) { animation-delay: 0.3s; }
        .loader-grid span:nth-child(7) { animation-delay: 0.2s; }
        .loader-grid span:nth-child(8) { animation-delay: 0.3s; }
        .loader-grid span:nth-child(9) { animation-delay: 0.4s; }
        @keyframes grid-fade {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        /* 时钟 */
        .loader-clock { 
            width: 50px; 
            height: 50px; 
            border: 3px solid rgba(255,255,255,0.2); 
            border-radius: 50%; 
            position: relative;
        }
        .loader-clock::before, .loader-clock::after {
            content: '';
            position: absolute;
            bottom: 50%; left: 50%;
            background: var(--primary);
            border-radius: 2px;
            transform-origin: bottom center;
        }
        .loader-clock::before {
            width: 3px; height: 18px;
            animation: clock-hour 8s linear infinite;
        }
        .loader-clock::after {
            width: 2px; height: 22px;
            animation: clock-min 2s linear infinite;
        }
        @keyframes clock-hour { to { transform: rotate(360deg); } }
        @keyframes clock-min { to { transform: rotate(360deg); } }
        
        /* 液体 */
        .loader-liquid { 
            width: 60px; 
            height: 60px; 
            position: relative;
            overflow: hidden;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.1);
        }
        .loader-liquid::before {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(180deg, var(--primary) 0%, var(--secondary) 100%);
            animation: liquid 2s ease-in-out infinite;
        }
        .loader-liquid::after {
            content: '';
            position: absolute;
            bottom: 40%; left: -50%;
            width: 200%; height: 200%;
            background: rgba(255,255,255,0.2);
            border-radius: 40%;
            animation: wave-liquid 3s linear infinite;
        }
        @keyframes liquid {
            0%, 100% { height: 20%; }
            50% { height: 80%; }
        }
        @keyframes wave-liquid {
            to { transform: rotate(360deg); }
        }
        
        /* ===== 进度加载器 ===== */
        .progress-container { 
            width: 100%; 
            max-width: 200px;
        }
        
        /* 线性进度 */
        .progress-linear { 
            height: 8px; 
            background: rgba(255,255,255,0.1); 
            border-radius: 4px; 
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-linear-bar { 
            height: 100%; 
            width: 0%; 
            background: linear-gradient(90deg, var(--primary) 0%, var(--secondary) 100%); 
            border-radius: 4px;
            transition: width 0.3s;
            position: relative;
        }
        .progress-linear-bar::after {
            content: '';
            position: absolute;
            top: 0; right: 0; bottom: 0;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        .progress-text { 
            font-size: 14px; 
            color: #6B7280;
            text-align: center;
        }
        
        /* 圆形进度 */
        .progress-circle { 
            width: 100px; 
            height: 100px; 
            margin: 0 auto 16px;
            position: relative;
        }
        .progress-circle svg { transform: rotate(-90deg); }
        .progress-circle-bg { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 8; }
        .progress-circle-fill { 
            fill: none; 
            stroke: url(#gradient); 
            stroke-width: 8; 
            stroke-linecap: round;
            stroke-dasharray: 283;
            stroke-dashoffset: 283;
            transition: stroke-dashoffset 0.3s;
        }
        .progress-circle-text { 
            position: absolute; 
            top: 50%; left: 50%;
            transform: translate(-50%, -50%); 
            font-size: 20px; 
            font-weight: 700;
        }
        
        /* 步骤进度 */
        .progress-steps { 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        .progress-step { 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            background: rgba(255,255,255,0.1); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 14px;
            transition: all 0.3s;
        }
        .progress-step.active { 
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); 
            animation: step-pulse 0.5s;
        }
        .progress-step.completed { background: #22C55E; }
        @keyframes step-pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .progress-connector { 
            flex: 1; 
            height: 2px; 
            background: rgba(255,255,255,0.1);
            position: relative;
        }
        .progress-connector-fill { 
            position: absolute; 
            top: 0; left: 0; bottom: 0;
            background: #22C55E;
            transition: width 0.5s;
        }
        
        /* ===== 文字加载器 ===== */
        .loader-text { 
            font-size: 24px; 
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--primary));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: text-gradient 3s linear infinite;
        }
        @keyframes text-gradient {
            to { background-position: 200% center; }
        }
        
        /* 打字机 */
        .loader-typewriter { 
            font-size: 18px; 
            color: #A1A1AA;
            border-right: 2px solid var(--primary);
            animation: blink 0.7s step-end infinite;
            white-space: nowrap;
            overflow: hidden;
        }
        @keyframes blink { 50% { border-color: transparent; } }
        
        /* 跳动文字 */
        .loader-bounce-text { 
            font-size: 24px; 
            font-weight: 700;
        }
        .loader-bounce-text span { 
            display: inline-block;
            animation: letter-bounce 0.6s ease-in-out infinite;
        }
        .loader-bounce-text span:nth-child(1) { animation-delay: 0s; }
        .loader-bounce-text span:nth-child(2) { animation-delay: 0.1s; }
        .loader-bounce-text span:nth-child(3) { animation-delay: 0.2s; }
        .loader-bounce-text span:nth-child(4) { animation-delay: 0.3s; }
        .loader-bounce-text span:nth-child(5) { animation-delay: 0.4s; }
        .loader-bounce-text span:nth-child(6) { animation-delay: 0.5s; }
        .loader-bounce-text span:nth-child(7) { animation-delay: 0.6s; }
        @keyframes letter-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        /* 控制按钮 */
        .controls { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            display: flex; 
            gap: 12px;
            z-index: 100;
        }
        .control-btn { 
            padding: 12px 24px; 
            background: rgba(136,72,249,0.9); 
            border: none; 
            border-radius: 25px; 
            color: white; 
            font-size: 14px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }
        .control-btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <svg width="0" height="0">
        <defs>
            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" style="stop-color:var(--primary)"/>
                <stop offset="100%" style="stop-color:var(--secondary)"/>
            </linearGradient>
        </defs>
    </svg>
    
    <div class="header">
        <h1>? 加载动画</h1>
        <p>丰富的加载状态指示器</p>
    </div>
    
    <!-- 经典 Spinner -->
    <div class="section">
        <div class="section-title">经典 Spinner</div>
        <div class="demo-grid">
            <div class="demo-card">
                <div class="spinner"></div>
                <h3>经典旋转</h3>
            </div>
            <div class="demo-card">
                <div class="spinner-double"></div>
                <h3>双环旋转</h3>
            </div>
            <div class="demo-card">
                <div class="spinner-pulse"></div>
                <h3>脉冲扩散</h3>
            </div>
            <div class="demo-card">
                <div class="spinner-dots">
                    <span></span><span></span><span></span>
                </div>
                <h3>跳动圆点</h3>
            </div>
            <div class="demo-card">
                <div class="spinner-orbit"></div>
                <h3>轨道运动</h3>
            </div>
        </div>
    </div>
    
    <!-- 创意加载器 -->
    <div class="section">
        <div class="section-title">创意加载器</div>
        <div class="demo-grid">
            <div class="demo-card">
                <div class="loader-wave">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
                <h3>音频波形</h3>
            </div>
            <div class="demo-card">
                <div class="loader-ripple"></div>
                <h3>波纹扩散</h3>
            </div>
            <div class="demo-card">
                <div class="loader-grid">
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
                <h3>方块网格</h3>
            </div>
            <div class="demo-card">
                <div class="loader-clock"></div>
                <h3>时钟转动</h3>
            </div>
            <div class="demo-card">
                <div class="loader-liquid"></div>
                <h3>液体填充</h3>
            </div>
        </div>
    </div>
    
    <!-- 进度加载器 -->
    <div class="section">
        <div class="section-title">进度加载器</div>
        <div class="demo-grid">
            <div class="demo-card">
                <div class="progress-container">
                    <div class="progress-linear">
                        <div class="progress-linear-bar" id="linearBar" style="width: 0%"></div>
                    </div>
                    <div class="progress-text" id="linearText">0%</div>
                </div>
                <h3>线性进度</h3>
            </div>
            <div class="demo-card">
                <div class="progress-circle">
                    <svg width="100" height="100" viewBox="0 0 100 100">
                        <circle class="progress-circle-bg" cx="50" cy="50" r="45"/>
                        <circle class="progress-circle-fill" id="circleBar" cx="50" cy="50" r="45"/>
                    </svg>
                    <span class="progress-circle-text" id="circleText">0%</span>
                </div>
                <h3>圆形进度</h3>
            </div>
            <div class="demo-card">
                <div class="progress-steps" id="progressSteps">
                    <div class="progress-step completed">?</div>
                    <div class="progress-connector">
                        <div class="progress-connector-fill" style="width: 100%"></div>
                    </div>
                    <div class="progress-step completed">?</div>
                    <div class="progress-connector">
                        <div class="progress-connector-fill" style="width: 60%"></div>
                    </div>
                    <div class="progress-step active">3</div>
                    <div class="progress-connector"></div>
                    <div class="progress-step">4</div>
                </div>
                <h3>步骤进度</h3>
            </div>
        </div>
    </div>
    
    <!-- 文字加载器 -->
    <div class="section">
        <div class="section-title">文字加载器</div>
        <div class="demo-grid">
            <div class="demo-card">
                <div class="loader-text">LOADING</div>
                <h3>渐变文字</h3>
            </div>
            <div class="demo-card">
                <div class="loader-typewriter" id="typewriter">正在加载...</div>
                <h3>打字机效果</h3>
            </div>
            <div class="demo-card">
                <div class="loader-bounce-text">
                    <span>L</span><span>O</span><span>A</span><span>D</span><span>I</span><span>N</span><span>G</span>
                </div>
                <h3>跳动字母</h3>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button class="control-btn" onclick="simulateLoading()">? 模拟加载</button>
        <button class="control-btn" onclick="resetLoading()">? 重置</button>
    </div>

    <script>
        let loadingInterval;
        
        function simulateLoading() {
            resetLoading();
            let progress = 0;
            
            loadingInterval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);
                }
                updateProgress(progress);
            }, 300);
        }
        
        function updateProgress(value) {
            // 线性进度
            document.getElementById('linearBar').style.width = value + '%';
            document.getElementById('linearText').textContent = Math.round(value) + '%';
            
            // 圆形进度
            const circumference = 2 * Math.PI * 45;
            const offset = circumference - (value / 100) * circumference;
            document.getElementById('circleBar').style.strokeDashoffset = offset;
            document.getElementById('circleText').textContent = Math.round(value) + '%';
        }
        
        function resetLoading() {
            clearInterval(loadingInterval);
            updateProgress(0);
        }
        
        // 打字机效果
        const texts = ['正在加载...', '请稍候...', '处理中...', '即将完成...'];
        let textIndex = 0;
        setInterval(() => {
            document.getElementById('typewriter').textContent = texts[textIndex];
            textIndex = (textIndex + 1) % texts.length;
        }, 2000);
        
        // 步骤动画
        const steps = document.querySelectorAll('.progress-step');
        let currentStep = 2;
        setInterval(() => {
            steps.forEach((step, i) => {
                step.classList.remove('active');
                if (i < currentStep) step.classList.add('completed');
                else step.classList.remove('completed');
            });
            steps[currentStep].classList.add('active');
            currentStep = (currentStep + 1) % steps.length;
        }, 2000);
    </script>></script>
    <!-- Kaelis 缁熶竴鍔犺浇鍣?-->
    <script src="../assets/js/kaelis-loader.js" data-modules="standard"></script>

</body>
</html>
