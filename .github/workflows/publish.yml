name: Kaelis Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-python-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build deps
        run: pip install build twine

      - name: Build wheel
        run: python -m build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaelis-wheel
          path: dist/*.whl

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*.whl
        continue-on-error: true

  build-electron:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend deps
        run: |
          cd web/frontend
          npm ci

      - name: Build & package Electron
        run: |
          cd web/frontend
          npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kaelis-electron-${{ matrix.os }}
          path: |
            web/frontend/dist/*.exe
            web/frontend/dist/*.dmg
            web/frontend/dist/*.AppImage
            web/frontend/dist/*.deb
            web/frontend/dist/*.rpm
          if-no-files-found: ignore

  build-vscode-extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install VSCE
        run: npm install -g @vscode/vsce

      - name: Package extension
        run: |
          cd vscode-kaelis
          npm ci
          vsce package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kaelis-vscode
          path: vscode-kaelis/*.vsix

      - name: Publish to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          cd vscode-kaelis
          vsce publish
        continue-on-error: true

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        continue-on-error: true

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            kaelis/kaelis:${{ steps.version.outputs.VERSION }}
            kaelis/kaelis:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  generate-sbom:
    runs-on: ubuntu-latest
    needs: [build-python-wheel]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install SBOM tools
        run: |
          pip install cyclonedx-bom pip-audit

      - name: Generate Python SBOM
        run: |
          cyclonedx-py requirements -o sbom-python.json --schema-version 1.5
          cyclonedx-py requirements -o sbom-python.xml --schema-version 1.5
        continue-on-error: true

      - name: Generate NPM SBOM
        run: |
          cd web/frontend
          npm ci
          npx @cyclonedx/cyclonedx-npm --output-file ../sbom-frontend.json
        continue-on-error: true

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: sbom-*

  create-release:
    needs: [build-python-wheel, build-electron, build-vscode-extension, build-docker, generate-sbom]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kaelis ${{ github.ref_name }}
          body: |
            ## What's New
            See [CHANGELOG.md](https://github.com/Alex-conder/Kaelis-archive/blob/main/CHANGELOG.md) for details.

            ## Assets
            - Python Wheel (PyPI)
            - Desktop App (Windows `.exe`, macOS `.dmg`, Linux `.AppImage`)
            - VSCode Extension (`.vsix`)
            - Docker Image (`docker pull kaelis/kaelis:${{ github.ref_name }}`)
            - SBOM Reports (Python + Frontend)
          files: |
            artifacts/kaelis-wheel/*.whl
            artifacts/kaelis-electron-*/*
            artifacts/kaelis-vscode/*.vsix
            artifacts/sbom-reports/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
