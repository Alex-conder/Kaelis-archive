name: Kaelis CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest
        env:
          ONEKE_MOCK_MODE: "true"
          SECRET_KEY: "ci-test-secret"
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          pytest tests/ -v --tb=long --cov=core --cov=api --cov-report=xml --cov-report=term -x 2>&1 | tee pytest-output.log || true

      - name: Upload pytest logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-py${{ matrix.python-version }}
          path: pytest-output.log

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/frontend/package.json

      - name: Debug environment
        working-directory: web/frontend
        run: |
          npm --version
          node --version
          wc -l package-lock.json

      - name: Install frontend dependencies
        working-directory: web/frontend
        env:
          HUSKY: 0
        run: |
          npm ci --ignore-scripts 2>&1 || npm install --ignore-scripts 2>&1
          npx vite --version || true

      - name: Lint frontend
        working-directory: web/frontend
        run: npm run lint || true

      - name: Build frontend
        working-directory: web/frontend
        run: npm run build

  e2e-test:
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/frontend/package.json

      - name: Install frontend dependencies
        working-directory: web/frontend
        env:
          HUSKY: 0
        run: |
          npm ci --ignore-scripts 2>&1 || npm install --ignore-scripts 2>&1

      - name: Install Playwright Browsers
        working-directory: web/frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: web/frontend
        continue-on-error: true
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/frontend/playwright-report/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build --progress=plain -t kaelis:test . 2>&1 | tee docker-build.log
          docker images kaelis:test

      - name: Upload Docker build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-logs
          path: docker-build.log

      - name: Test Docker image health
        run: |
          docker run -d --name kaelis-test -p 5000:5000 \
            -e SECRET_KEY=test-secret \
            -e ONEKE_MOCK_MODE=true \
            -e KAELIS_DATA_DIR=/tmp/kaelis \
            kaelis:test
          sleep 15
          docker logs kaelis-test > docker-run.log 2>&1 || true
          cat docker-run.log
          curl -v http://localhost:5000/api/knowledge_graph/health || true
          curl -f http://localhost:5000/api/knowledge_graph/health
          docker stop kaelis-test
          docker rm kaelis-test

      - name: Upload container logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-run-logs
          path: docker-run.log
