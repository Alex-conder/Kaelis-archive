name: Kaelis CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast unit tests
        run: |
          pytest -q --tb=short -m "not slow and not e2e" tests/
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Run integration + slow + e2e tests
        run: |
          pytest -q --tb=short -m "slow or integration or e2e" tests/
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Run tests with coverage
        run: |
          pytest --cov=core --cov=api --cov-report=xml --cov-report=term-missing --cov-fail-under=60 tests/
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Coverage diff gate
        run: |
          python scripts/check_coverage_gate.py --threshold 1.0
        env:
          PYTHONIOENCODING: utf-8

      - name: Performance regression check
        run: |
          python scripts/check_performance.py
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  frontend-build:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run lint check
        run: npm run lint -- --max-warnings=50

      - name: Bundle size check
        run: |
          python ../../scripts/check_bundle_size.py --dist ./dist
        shell: bash

  hygiene-check:
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: TODO/FIXME hygiene gate
        run: |
          python scripts/auto_fix_todos.py
        env:
          PYTHONIOENCODING: utf-8

  smoke-test:
    runs-on: windows-latest
    timeout-minutes: 5
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend in background
        shell: powershell
        run: |
          $proc = Start-Process python -ArgumentList "prod_server.py" -PassThru -WindowStyle Hidden
          echo "BACKEND_PID=$($proc.Id)" >> $env:GITHUB_ENV
          Start-Sleep -Seconds 8

      - name: Smoke test streaming API
        shell: powershell
        run: |
          python scripts/smoke_test_stream.ps1

      - name: Stop backend
        if: always()
        shell: powershell
        run: |
          if ($env:BACKEND_PID) { Stop-Process -Id $env:BACKEND_PID -Force -ErrorAction SilentlyContinue }

  committee-review:
    runs-on: windows-latest
    timeout-minutes: 10
    needs: [backend-tests, frontend-build, hygiene-check]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate ten-dimension report
        run: |
          python -m kaelis diagnose --full > committee_report.md || echo "DIAGNOSE_FAILED=true" >> $env:GITHUB_ENV
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Generate tech-debt snapshot
        run: |
          python scripts/auto_fix_todos.py --report-only >> committee_report.md
        env:
          PYTHONIOENCODING: utf-8

      - name: Generate performance baseline
        run: |
          python scripts/check_performance.py >> committee_report.md
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Append ecosystem integration assessment
        run: |
          echo "" >> committee_report.md
          echo "## 生态整合维度专项评估" >> committee_report.md
          echo "" >> committee_report.md
          echo "- MCP Tool 数量: $(grep -c '@mcp.tool' core/mcp/server.py || echo 'N/A')" >> committee_report.md
          echo "- 外部协议适配: A2A(骨架), LSP(无), MCP(完整)" >> committee_report.md
          echo "- 第三方集成: NVIDIA NIM, n8n, Hermes/OpenClaw" >> committee_report.md
          echo "- 社区插件机制: tool.register_external 已就绪, 待文档化" >> committee_report.md

      - name: Post committee report as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('committee_report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🏛️ Committee Review Report (Auto-generated)\n\n${report}`
            });

      - name: Upload committee report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committee-review-report
          path: committee_report.md
