name: Kaelis CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast unit tests
        run: |
          pytest -q --tb=short -m "not slow and not e2e" tests/
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Run integration + slow + e2e tests
        run: |
          pytest -q --tb=short -m "slow or integration or e2e" tests/
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Run tests with coverage
        run: |
          pytest --cov=core --cov=api --cov-report=xml --cov-report=term-missing --cov-fail-under=60 tests/
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Coverage diff gate
        run: |
          python scripts/check_coverage_gate.py --threshold 1.0
        env:
          PYTHONIOENCODING: utf-8

      - name: Performance benchmark
        run: |
          pytest tests/ -k "not e2e" --benchmark-only --benchmark-json=benchmark_current.json || true
          # Fallback: generate custom benchmark from test durations if pytest-benchmark unavailable
          python -c "
import json, xml.etree.ElementTree as ET
tree = ET.parse('.pytest_cache/v/cache/nodeids') if False else None
# Use pytest durations as proxy benchmark
import subprocess, re
result = subprocess.run(['pytest', 'tests/', '-k', 'not e2e', '--durations=0', '-q', '--tb=no'], capture_output=True, text=True)
times = {}
for line in result.stdout.split('\n'):
    m = re.match(r'([\d.]+)s\s+call\s+(.+)', line)
    if m:
        times[m.group(2)] = float(m.group(1))
with open('benchmark_current.json', 'w') as f:
    json.dump(times, f, indent=2)
"
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Download baseline benchmark
        uses: actions/download-artifact@v4
        with:
          name: benchmark-baseline
          path: .
        continue-on-error: true

      - name: Detect performance regression
        shell: bash
        run: |
          if [ -f benchmark_baseline.json ]; then
            python scripts/perf_regression_detective.py --current benchmark_current.json --baseline benchmark_baseline.json --ci --threshold 3
          else
            echo "No baseline found, storing current as baseline"
          fi
        env:
          PYTHONIOENCODING: utf-8

      - name: Store benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: benchmark_current.json
          retention-days: 30

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  frontend-build:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Run lint check
        run: npm run lint -- --max-warnings=20

  hygiene:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run hygiene checks
        run: python scripts/check_hygiene.py

      - name: Document drift check
        run: |
          python scripts/sync_dev_status.py
          git diff --exit-code dev-status/
