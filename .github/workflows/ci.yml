name: Kaelis CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fast unit tests
        run: |
          pytest -q --tb=short -m "not slow and not e2e" tests/
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Run integration + slow + e2e tests
        run: |
          pytest -q --tb=short -m "slow or integration or e2e" tests/
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Run tests with coverage
        run: |
          pytest --cov=core --cov=api --cov-report=xml --cov-report=term-missing --cov-fail-under=60 tests/
        env:
          PYTHONIOENCODING: utf-8
          GRAPH_DB_TYPE: sqlite

      - name: Coverage diff gate
        run: |
          python scripts/check_coverage_gate.py --threshold 1.0
        env:
          PYTHONIOENCODING: utf-8

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  frontend-build:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run lint check
        run: npm run lint -- --max-warnings=50
