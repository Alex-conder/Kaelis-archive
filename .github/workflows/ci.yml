name: Kaelis CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest
        env:
          ONEKE_MOCK_MODE: "true"
          SECRET_KEY: "ci-test-secret"
          PYTHONPATH: "${{ github.workspace }}"
        run: |
          pytest tests/ -v --cov=core --cov=api --cov-report=xml --cov-report=term -x

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/frontend/package.json

      - name: Install frontend dependencies
        working-directory: web/frontend
        env:
          HUSKY: 0
        run: |
          npm ci --ignore-scripts
          # Manually install native deps that don't need postinstall
          npx vite --version || true

      - name: Lint frontend
        working-directory: web/frontend
        run: npm run lint || true

      - name: Build frontend
        working-directory: web/frontend
        run: npm run build

  e2e-test:
    runs-on: ubuntu-latest
    needs: [frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/frontend/package.json

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: web/frontend
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: web/frontend
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/frontend/playwright-report/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, e2e-test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t kaelis:test .
          docker images kaelis:test

      - name: Test Docker image health
        run: |
          docker run -d --name kaelis-test -p 5000:5000 \
            -e SECRET_KEY=test-secret \
            -e ONEKE_MOCK_MODE=true \
            kaelis:test
          sleep 5
          curl -f http://localhost:5000/health || exit 1
          docker stop kaelis-test
          docker rm kaelis-test
