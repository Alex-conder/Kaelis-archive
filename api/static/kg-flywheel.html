<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowledge Graph Flywheel - Kaelis</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #334155;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        
        .pipeline {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        .pipe-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 25px;
            background: #1e293b;
            border-radius: 12px;
            border: 2px solid #334155;
            transition: all 0.3s ease;
        }
        
        .pipe-stage.active {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
        }
        
        .pipe-stage.completed {
            border-color: #10b981;
            background: #064e3b20;
        }
        
        .pipe-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        
        .pipe-label {
            font-weight: 600;
            color: #cbd5e1;
            font-size: 0.9rem;
        }
        
        .arrow {
            font-size: 1.5rem;
            color: #64748b;
        }
        
        /* 主面板 - 左右分栏 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            height: calc(100vh - 280px);
            min-height: 600px;
        }
        
        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 1fr;
                height: auto;
            }
        }
        
        /* 左侧聊天面板 */
        .chat-section {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 16px;
            max-height: 500px;
        }
        
        .message {
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message-user {
            text-align: right;
        }
        
        .message-user .bubble {
            background: #3b82f6;
            display: inline-block;
            padding: 12px 16px;
            border-radius: 16px 16px 4px 16px;
            max-width: 80%;
            text-align: left;
        }
        
        .message-agent .bubble {
            background: #334155;
            display: inline-block;
            padding: 12px 16px;
            border-radius: 16px 16px 16px 4px;
            max-width: 80%;
            white-space: pre-wrap;
        }
        
        .input-area {
            display: flex;
            gap: 10px;
            padding-top: 16px;
            border-top: 1px solid #334155;
        }
        
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #334155;
            border-radius: 8px;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 1rem;
        }
        
        .input-area input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* 右侧可视化面板 */
        .graph-section {
            background: #1e293b;
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .graph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #334155;
        }
        
        .graph-header h3 {
            color: #94a3b8;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .graph-controls {
            display: flex;
            gap: 10px;
        }
        
        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
            background: #334155;
            color: #e2e8f0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        
        .btn-small:hover {
            background: #475569;
        }
        
        #graph-container {
            flex: 1;
            min-height: 400px;
            border-radius: 12px;
            background: #0f172a;
        }
        
        .graph-info {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #334155;
            font-size: 0.85rem;
            color: #64748b;
        }
        
        .graph-info span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* 快捷操作 */
        .quick-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        
        .quick-btn {
            padding: 8px 14px;
            background: #334155;
            border: none;
            border-radius: 6px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        
        .quick-btn:hover {
            background: #3b82f6;
            color: white;
        }
        
        /* 状态栏 */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 10px;
            background: #0f172a;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-top: 15px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
        }
        
        .status-dot.connecting {
            background: #f59e0b;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .loading {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .loading span {
            width: 8px;
            height: 8px;
            background: #3b82f6;
            border-radius: 50%;
            animation: bounce 0.6s infinite alternate;
        }
        
        .loading span:nth-child(2) { animation-delay: 0.2s; }
        .loading span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes bounce {
            to { transform: translateY(-8px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔄 Knowledge Graph Flywheel</h1>
            <p class="subtitle">Extract → Query → Inspect 闭环智能体 | 对话驱动的实时知识图谱可视化</p>
        </header>
        
        <div class="pipeline">
            <div class="pipe-stage" id="stage-extract">
                <div class="pipe-icon">📥</div>
                <div class="pipe-label">Extract</div>
            </div>
            <div class="arrow">→</div>
            <div class="pipe-stage" id="stage-query">
                <div class="pipe-icon">🔍</div>
                <div class="pipe-label">Query</div>
            </div>
            <div class="arrow">→</div>
            <div class="pipe-stage" id="stage-inspect">
                <div class="pipe-icon">🔍</div>
                <div class="pipe-label">Inspect</div>
            </div>
        </div>
        
        <div class="main-layout">
            <!-- 左侧：聊天面板 -->
            <div class="chat-section">
                <div class="quick-actions">
                    <button class="quick-btn" onclick="setInput('提取：阿里巴巴由马云创立，总部位于杭州')">📝 示例提取</button>
                    <button class="quick-btn" onclick="setInput('查询所有实体')">🔍 查询</button>
                    <button class="quick-btn" onclick="setInput('运行质量检查')">✓ 质检</button>
                    <button class="quick-btn" onclick="setInput('执行飞轮')">🔄 飞轮</button>
                </div>
                
                <div class="chat-messages" id="chatMessages">
                    <div class="message message-agent">
                        <div class="bubble">
👋 欢迎使用知识图谱飞轮！

我可以帮您：
• 📥 从文本中提取知识三元组
• 🔍 查询已构建的知识图谱  
• ✓ 评估图谱质量
• 🔄 执行完整的 Extract→Query→Inspect 闭环

右侧会实时显示知识图谱可视化！
                        </div>
                    </div>
                </div>
                
                <div class="input-area">
                    <input type="text" id="userInput" placeholder="输入文本或命令..." 
                           onkeypress="if(event.key==='Enter')sendMessage()">
                    <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">发送</button>
                </div>
                
                <div class="status-bar">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="status-dot" id="statusDot"></div>
                        <span id="statusText">就绪</span>
                    </div>
                    <span>•</span>
                    <span>实体: <b id="statEntities">0</b></span>
                    <span>关系: <b id="statRelations">0</b></span>
                    <span>质量分: <b id="statScore">-</b></span>
                </div>
            </div>
            
            <!-- 右侧：可视化面板 -->
            <div class="graph-section">
                <div class="graph-header">
                    <h3>🧠 知识图谱实时视图</h3>
                    <div class="graph-controls">
                        <button class="btn-small" onclick="refreshGraph()">🔄 刷新</button>
                        <button class="btn-small" onclick="resetGraphView()">⊘ 重置</button>
                    </div>
                </div>
                <div id="graph-container"></div>
                <div class="graph-info">
                    <span>📊 节点: <b id="graphNodeCount">0</b></span>
                    <span>🔗 边: <b id="graphEdgeCount">0</b></span>
                    <span>📍 会话: <span id="graphSessionId">-</span></span>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // ==================== 状态管理 ====================
        const state = {
            sessionId: null,
            ws: null,
            isProcessing: false,
            entities: 0,
            relations: 0,
            score: '-'
        };
        
        let graphChart = null;
        
        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', () => {
            initWebSocket();
            initGraph();
        });
        
        // ==================== WebSocket ====================
        function initWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws/kg-flywheel`;
            
            updateStatus('connecting', '连接中...');
            
            try {
                state.ws = new WebSocket(wsUrl);
                
                state.ws.onopen = () => {
                    updateStatus('connected', '已连接');
                };
                
                state.ws.onmessage = (event) => {
                    handleMessage(JSON.parse(event.data));
                };
                
                state.ws.onclose = () => {
                    updateStatus('disconnected', '已断开');
                    setTimeout(initWebSocket, 5000);
                };
                
                state.ws.onerror = () => {
                    updateStatus('error', '连接错误');
                };
            } catch (e) {
                updateStatus('error', '连接失败');
                state.ws = null;
            }
        }
        
        function updateStatus(status, text) {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            dot.className = 'status-dot';
            if (status === 'connecting') dot.classList.add('connecting');
            statusText.textContent = text;
        }
        
        function handleMessage(data) {
            if (data.type === 'response') {
                handleResponse(data.payload);
            } else if (data.type === 'stage_update') {
                updatePipeline(data.stage, data.status);
            } else if (data.type === 'stats_update') {
                updateStats(data.stats);
            }
        }
        
        // ==================== 图谱可视化 (ECharts) ====================
        function initGraph() {
            const container = document.getElementById('graph-container');
            graphChart = echarts.init(container, 'dark');
            
            // 初始空图
            const option = {
                backgroundColor: 'transparent',
                title: {
                    text: '等待数据...',
                    left: 'center',
                    top: 'center',
                    textStyle: {
                        color: '#64748b',
                        fontSize: 16
                    }
                }
            };
            graphChart.setOption(option);
            
            // 响应窗口变化
            window.addEventListener('resize', () => {
                graphChart.resize();
            });
        }
        
        async function loadGraph(sessionId) {
            if (!sessionId) return;
            
            state.sessionId = sessionId;
            document.getElementById('graphSessionId').textContent = sessionId;
            
            graphChart.showLoading({
                text: '加载中...',
                color: '#3b82f6',
                textColor: '#94a3b8',
                maskColor: 'rgba(15, 23, 42, 0.8)'
            });
            
            try {
                const response = await fetch(`/api/kg-flywheel/graph/${sessionId}`);
                const data = await response.json();
                
                if (data.error) {
                    console.error('Graph load error:', data.error);
                    graphChart.hideLoading();
                    return;
                }
                
                // 更新统计
                document.getElementById('graphNodeCount').textContent = data.node_count || 0;
                document.getElementById('graphEdgeCount').textContent = data.edge_count || 0;
                
                // 准备数据
                const nodes = data.nodes.map(n => ({
                    id: n.id,
                    name: n.label,
                    symbolSize: 40 + Math.random() * 20,
                    category: 0,
                    itemStyle: {
                        color: '#3b82f6'
                    }
                }));
                
                const edges = data.edges.map((e, idx) => ({
                    source: e.source,
                    target: e.target,
                    label: {
                        show: true,
                        formatter: e.relation || '关联',
                        fontSize: 10,
                        color: '#94a3b8'
                    },
                    lineStyle: {
                        curveness: 0.2,
                        width: 2,
                        color: '#475569'
                    }
                }));
                
                const option = {
                    backgroundColor: 'transparent',
                    tooltip: {
                        trigger: 'item',
                        formatter: (params) => {
                            if (params.dataType === 'node') {
                                return `实体: ${params.name}`;
                            }
                            return `${params.data.source} → ${params.data.target}`;
                        }
                    },
                    series: [{
                        type: 'graph',
                        layout: 'force',
                        force: {
                            repulsion: 800,
                            edgeLength: [100, 200],
                            gravity: 0.1,
                            friction: 0.1
                        },
                        roam: true,
                        draggable: true,
                        data: nodes,
                        edges: edges,
                        label: {
                            show: true,
                            position: 'bottom',
                            color: '#e2e8f0',
                            fontSize: 12
                        },
                        emphasis: {
                            focus: 'adjacency',
                            lineStyle: { width: 4 }
                        },
                        animation: true,
                        animationDuration: 1500,
                        animationEasingUpdate: 'quinticInOut'
                    }]
                };
                
                graphChart.hideLoading();
                graphChart.setOption(option);
                
            } catch (err) {
                console.error('Graph load failed:', err);
                graphChart.hideLoading();
            }
        }
        
        function refreshGraph() {
            if (state.sessionId) {
                loadGraph(state.sessionId);
            }
        }
        
        function resetGraphView() {
            if (graphChart) {
                graphChart.dispatchAction({
                    type: 'restore'
                });
            }
        }
        
        // ==================== 聊天功能 ====================
        function setInput(text) {
            document.getElementById('userInput').value = text;
            document.getElementById('userInput').focus();
        }
        
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            
            if (!text || state.isProcessing) return;
            
            // 添加用户消息
            addMessage('user', text);
            input.value = '';
            
            state.isProcessing = true;
            document.getElementById('sendBtn').disabled = true;
            
            // 显示加载状态
            const loadingId = addMessage('agent', '<div class="loading"><span></span><span></span><span></span></div>');
            
            try {
                const response = await fetch('/api/kg-flywheel/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        user_id: 'web-user'
                    })
                });
                
                const data = await response.json();
                removeMessage(loadingId);
                
                if (data.error) {
                    addMessage('agent', `错误: ${data.error}`);
                } else {
                    addMessage('agent', data.reply);
                    
                    // 更新会话ID并刷新图谱
                    if (data.session_id) {
                        state.sessionId = data.session_id;
                        // 延迟刷新，等待后端写入
                        setTimeout(() => loadGraph(data.session_id), 500);
                    }
                    
                    // 更新统计
                    if (data.data && data.data.summary) {
                        document.getElementById('statEntities').textContent = 
                            data.data.summary.entity_count || 0;
                        document.getElementById('statRelations').textContent = 
                            data.data.summary.relation_count || 0;
                        document.getElementById('statScore').textContent = 
                            (data.data.summary.overall_score * 100).toFixed(0) + '%';
                    }
                }
                
            } catch (error) {
                removeMessage(loadingId);
                addMessage('agent', `错误: ${error.message}`);
            }
            
            state.isProcessing = false;
            document.getElementById('sendBtn').disabled = false;
        }
        
        function addMessage(role, content) {
            const messages = document.getElementById('chatMessages');
            const id = 'msg-' + Date.now();
            
            const msgDiv = document.createElement('div');
            msgDiv.id = id;
            msgDiv.className = `message message-${role}`;
            msgDiv.innerHTML = `<div class="bubble">${content}</div>`;
            
            messages.appendChild(msgDiv);
            messages.scrollTop = messages.scrollHeight;
            
            return id;
        }
        
        function removeMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
        
        function handleResponse(data) {
            if (data.session_id) {
                state.sessionId = data.session_id;
                setTimeout(() => loadGraph(data.session_id), 500);
            }
        }
        
        function updatePipeline(stage, status) {
            const stageEl = document.getElementById(`stage-${stage}`);
            if (stageEl) {
                stageEl.classList.remove('active', 'completed');
                stageEl.classList.add(status);
            }
        }
        
        function updateStats(stats) {
            if (stats.entities !== undefined) {
                document.getElementById('statEntities').textContent = stats.entities;
            }
            if (stats.relations !== undefined) {
                document.getElementById('statRelations').textContent = stats.relations;
            }
            if (stats.score !== undefined) {
                document.getElementById('statScore').textContent = 
                    (stats.score * 100).toFixed(0) + '%';
            }
        }
    </script>
</body>
</html>
